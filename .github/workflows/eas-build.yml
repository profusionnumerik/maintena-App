name: EAS Build + Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à builder'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      submit:
        description: 'Soumettre au store après le build ?'
        required: true
        default: 'true'
        type: boolean

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive

      - name: Submit to store
        if: ${{ inputs.submit == 'true' }}
        run: eas submit --platform ${{ inputs.platform }} --profile production --non-interactive
